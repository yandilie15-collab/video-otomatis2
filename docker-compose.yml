version: "3.9"

services:
  web:
    build: .
    container_name: avf_api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db
      - redis

  worker:
    build: .
    container_name: avf_worker
    command: celery -A app.worker worker --loglevel=info
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      - redis
      - db

  db:
    image: postgres:15
    container_name: avf_postgres
    restart: always
    environment:
      POSTGRES_USER: avf
      POSTGRES_PASSWORD: avfpass
      POSTGRES_DB: avfdb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: avf_redis
    ports:
      - "6379:6379"

volumes:
  pgdata:
